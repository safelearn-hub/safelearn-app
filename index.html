<script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://gqvspimkjgkthlszevmz.supabase.co';
    
    // Paste your exact legacy anon key from your Supabase dashboard (starts with eyJ...)
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxdnNwaW1ramdrdGhsc3pldm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTcwMDIsImV4cCI6MjEwNzQ5MzAwMn0.b2uIkRR_p6YuZpq1xWDT9wfapyGmjRsdm9kFlAc_-yc'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('form-title').innerText = isSignUp ? 'Student Registration' : 'Student Login';
      document.getElementById('submit-btn').innerText = isSignUp ? 'Create Account' : 'Login to Portal';
      document.getElementById('name-group').style.display = isSignUp ? 'block' : 'none';
      document.getElementById('student-id-group').style.display = isSignUp ? 'block' : 'none';
      document.getElementById('toggle-text').innerText = isSignUp ? 'Already registered?' : 'Need an account?';
      document.getElementById('toggle-btn').innerText = isSignUp ? 'Login here' : 'Register here';
      hideMessage();
    }

    function showMessage(text, type) {
      const msgBox = document.getElementById('message');
      msgBox.innerText = text;
      msgBox.className = type;
      msgBox.style.display = 'block';
    }

    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if (!email || !password) {
        showMessage('Please fill in all required fields.', 'error');
        return;
      }

      if (isSignUp) {
        const fullName = document.getElementById('full_name').value.trim();
        const studentId = document.getElementById('student_id').value.trim();

        if (!fullName || !studentId) {
          showMessage('Full Name and Student ID are required for registration.', 'error');
          return;
        }

        showMessage('Creating your account...', 'info');

        // 1. Sign up user in Supabase Auth
        const { data, error } = await supabaseClient.auth.signUp({ 
          email, 
          password,
          options: {
            data: {
              full_name: fullName,
              student_id: studentId
            }
          }
        });

        if (error) {
          showMessage(error.message, 'error');
          return;
        }

        if (data.user) {
          // 2. Insert/Upsert into Profiles table
          const { error: profileErr } = await supabaseClient
            .from('profiles')
            .upsert([{ 
              id: data.user.id, 
              full_name: fullName, 
              student_id: studentId, 
              is_approved: false 
            }]);

          if (profileErr) {
            console.error('Profile Error:', profileErr);
            showMessage('Account created! Please notify admin for MoMo payment activation.', 'info');
          } else {
            showMessage('Registration successful! Please send your MoMo payment proof to safelearn.contact@gmail.com for account activation.', 'info');
          }
        }
      } else {
        // Handle Login
        showMessage('Logging in...', 'info');

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          showMessage(error.message, 'error');
          return;
        }

        // Check approval status in profiles table
        const { data: profile, error: pError } = await supabaseClient
          .from('profiles')
          .select('is_approved, full_name')
          .eq('id', data.user.id)
          .single();

        if (profile) {
          if (!profile.is_approved) {
            showMessage(`Welcome ${profile.full_name}! Your account is pending MoMo payment verification. Please contact safelearn.contact@gmail.com for activation.`, 'info');
          } else {
            showMessage(`Welcome back, ${profile.full_name}! Redirecting to courses...`, 'success');
          }
        } else {
          showMessage('Login successful! Welcome to SafeLearn.', 'success');
        }
      }
    }
  </script>
